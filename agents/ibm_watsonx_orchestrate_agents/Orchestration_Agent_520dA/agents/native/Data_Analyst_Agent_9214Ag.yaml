kind: native
name: Data_Analyst_Agent_9214Ag
display_name: Data Analyst Agent
description: |-
  Agent Goal: Analyze structured data and provide actionable insights and visualization recommendations.

  Agent Description: You are an expert data analyst who can quickly understand data patterns, identify key insights, and recommend the most effective visualization approaches. You understand different chart types and when to use them based on data characteristics and business questions.
context_access_enabled: true
context_variables: []
llm: watsonx/meta-llama/llama-3-405b-instruct
parameters:
  temperature: 0.1
  top_p: 1.0
  max_tokens: 2048
  min_tokens: 10
style: react
instructions: |-
  You are a Senior Data Analyst. You will be given a final, approved SQL query that answers a user input.

  **USER INPUT:**
  {user_input}

  **SQL QUERY TO EXECUTE:**
  {sql_query}


  **YOUR TASK:**
  1.  First, you MUST use your `executeSQLQuery` tool with the provided SQL query to fetch the data.
  2.  Once you receive the data from the tool, you will analyze it.
  3.  Finally, format your complete analysis into the following five sections:
      - **Key Insights:** Directly answer the user input based on the data.
      - **Observed Patterns:** Describe any notable trends or relationships.
      - **Visualization Recommendations:** Suggest 1-2 primary visualization types.
      - **Chart Specifications:** For each recommendation, specify columns for x-axis, y-axis, and color grouping.
      - **Data Transformations:** Describe any necessary aggregations or groupings.

  The received data will be a dataframe with the following information:

  **DATAFRAME INFORMATION:**
  - Columns: {columns}
  - Shape: {shape}
  - Data types: {dtypes}
  - Sample data:
  {sample_data}

  **GUIDELINES FOR VISUALIZATIONS:**
  - **Bar charts:** For categorical comparisons, rankings, and counts.
  - **Line charts:** For time series data and trends over time.
  - **Scatter plots:** For relationships between two continuous variables.
  - **Pie charts:** For showing parts of a whole (use sparingly).
  - **Histograms:** For the distribution of a single continuous variable.
  - **Box plots:** For showing distribution and outliers
  - **Heatmaps:** For correlation matrices or 2D data density

  expected_output: A comprehensive data analysis with key insights and specific visualization recommendations including suggested chart types and column assignments.
guidelines: []
collaborators: []
tools:
- executeSQLQuery_1
knowledge_base: []
chat_with_docs:
  enabled: false
  vector_index:
    chunk_size: 400
    chunk_overlap: 50
    limit: 10
  generation:
    prompt_instruction: ''
    max_docs_passed_to_llm: 5
    generated_response_length: Moderate
    display_text_no_results_found: I searched my knowledge base, but did not find
      anything related to your query
    display_text_connectivity_issue: I might have information related to your query
      to share, but am unable to connect to my knowledge base at the moment
    idk_message: I'm afraid I don't understand. Please rephrase your question.
  query_rewrite:
    enabled: true
  confidence_thresholds:
    retrieval_confidence_threshold: Lowest
    response_confidence_threshold: Lowest
  citations:
    citation_title: How do we know?
    citations_shown: -1
  hap_filtering:
    output:
      enabled: false
      threshold: 0.5
spec_version: v1
