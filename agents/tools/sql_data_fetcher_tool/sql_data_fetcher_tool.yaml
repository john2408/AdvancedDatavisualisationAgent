openapi: 3.0.0
info:
  title: "SQL Data Fetcher (Productive)"
  description: "A tool that executes a SQL query against the live PostgreSQL database and returns a structured data summary."
  version: "1.0.0"

servers:
  - url: "https://sql-data-fetcher-tool.1zjf0upfwqwy.us-south.codeengine.appdomain.cloud"
    description: "IBM Cloud Code Engine production server."

paths:
  /:
    post:
      summary: "Execute SQL Query"
      operationId: "executeSQLQuery"
      description: |
        Accepts a SQL query string, executes it against the vehicle registrations database, 
        and returns a summary of the resulting data, including columns, shape, data types, 
        and a sample of the first 5 rows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sql_query:
                  type: string
                  description: "A valid SQL query string to be executed against the database."
              required:
                - sql_query
            example:
              sql_query: "SELECT * FROM \"FactRegisteredVehicles\" LIMIT 5;"
      responses:
        '200':
          description: "Successful query execution. Returns the data summary."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data_summary:
                    type: object
                    properties:
                      columns:
                        type: array
                        items:
                          type: string
                      shape:
                        type: array
                        items:
                          type: integer
                      dtypes:
                        type: object
                        additionalProperties:
                          type: string
                      sample_data:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
        '400':
          description: "Bad Request. The 'sql_query' parameter was missing."
        '500':
          description: "Internal Server Error. The database query failed."

