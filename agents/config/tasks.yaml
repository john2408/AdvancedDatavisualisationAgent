query_task:
  description: |
    You are an expert SQL assistant. Your job is to translate user requests into SQL queries using ONLY the tables and columns listed below.
    SCHEMA:
    {db_schema}
    USER REQUEST:
    {user_input}
    IMPORTANT:
    - First, list which tables and columns from the schema you will use to answer the request.
    - Then, write the SQL query.
    - Only use the tables and columns from the schema above.
    - If the request cannot be satisfied with the schema, return a SQL comment (starting with --) explaining why.
    - Do NOT invent tables or columns.
    - Make sure the query matches the user's intent as closely as possible.
  expected_output: First, a list of tables and columns to use. Then, a syntactically correct SQL query using appropriate filters, joins, and groupings.

review_task:
  description: |
    Review the following SQL query for correctness, performance, and readability: {sql_query} and verify that the query fits the schema: {db_schema}
    Ensure that only tables and columns from the provided schema are used.
    IMPORTANT:
    - First, only review the SQL query provided for correctness, performance, or readability
    - Do NOT invent new tables or columns.
    - If the Query is already correct, return it unchanged.
    - If the Query is not correct and cannot be fixed, return a SQL comment (starting with --) explaining why.
  expected_output: An optimized or verified SQL query

compliance_task:
  description: >
    Review the following SQL query for compliance violations, including PII access, unsafe usage, or policy violations.
    List any issues found, or state "No issues found" if the query is compliant.
    SQL Query: {reviewed_sqlquery}
  expected_output: >
    A markdown-formatted compliance report listing any flagged issues, or stating that the query is compliant. Include a clear verdict at the top (e.g., "Compliant" or "Issues found").

data_analysis_task:
  description: |
    Analyze the provided DataFrame and provide insights and visualization recommendations.
    
    DATAFRAME INFORMATION:
    - Columns: {columns}
    - Shape: {shape}
    - Data types: {dtypes}
    - Sample data: {sample_data}
    
    USER QUESTION: {user_question}
    
    Your analysis should include:
    1. Key insights from the data that answer the user's question
    2. Data patterns, trends, or anomalies you observe
    3. Recommended visualization types that would best represent this data
    4. Suggested columns for x-axis, y-axis, and color grouping
    5. Any data transformations or aggregations that would be helpful
    
    Consider the following visualization types and when to use them:
    - Bar charts: For categorical comparisons, rankings, and counts
    - Line charts: For time series data and trends over time
    - Scatter plots: For relationships between two continuous variables
    - Pie charts: For showing parts of a whole (limited categories)
    - Histograms: For distribution of continuous variables
    - Box plots: For showing distribution and outliers
    - Heatmaps: For correlation matrices or 2D data density
  expected_output: A comprehensive data analysis with key insights and specific visualization recommendations including suggested chart types and column assignments.

visualization_task:
  description: |
    Create the best visualization for the analyzed data based on the recommendations from the data analyst.
    
    DATA ANALYSIS CONTEXT: {analysis}
    DATAFRAME JSON: {dataframe_json}
    
    Your task:
    1. Choose the most appropriate visualization type from: bar, line, scatter, pie, histogram, boxplot, heatmap
    2. Select the best columns for x-axis, y-axis, and color grouping
    3. Determine appropriate aggregation method if needed (sum, count, mean, max, min)
    4. Create a clear and descriptive title
    5. Use the DataFrame Visualization Tool to generate the plot specification
    
    Guidelines for plot type selection:
    - Use BAR charts for: categorical comparisons, rankings, counts by category
    - Use LINE charts for: time series, trends over sequential data
    - Use SCATTER plots for: relationships between two continuous variables
    - Use PIE charts for: proportions/percentages with few categories (<=6)
    - Use HISTOGRAM for: distribution of single continuous variable
    - Use BOXPLOT for: distribution analysis, outlier detection
    - Use HEATMAP for: correlation analysis, 2D density data
    
    Column selection tips:
    - X-axis: Categories, time periods, or continuous variables for scatter plots
    - Y-axis: Metrics, counts, or continuous values to measure
    - Color: Additional categorical grouping for deeper insights
    
    IMPORTANT: Use the DataFrame Visualization Tool with the dataframe_json to create the actual plot specification.
  expected_output: A complete visualization specification including plot type, column selections, aggregation method, title, and the generated plot JSON specification.

interpret_task:
  description: >
    Interpret the output of query {ReviewedSQLQuery}.
  expected_output: A stakeholder-friendly explanation of trends or findings.
    