  # 🚗 UK Vehicle Registration Analytics (Traditional Star Schema)
  
  ## 📊 What Can You Analyze?
  
  This database contains **UK vehicle registration data for 2024** in a traditional star schema design. You can explore actual vehicle registration counts (not percentages) for different manufacturers across time, geography, and vehicle characteristics. All queries require joins between fact and dimension tables.
  
  ---
  
  ## 📈 Available Data & Analytics
  
  ### � **OEM Performance Analysis**
  Ask about vehicle manufacturers and their registration volumes:
  
  **Registration Volume Questions:**
  - *"Which car manufacturers registered the most vehicles in 2024?"*
  - *"How did BMW's registration volumes change month by month?"*
  - *"Compare Tesla vs traditional luxury brands registration counts"*
  - *"Show me the top 10 OEMs by total registrations"*
  
  **Market Share Calculations:**
  - *"Calculate market share for each OEM by country"*
  - *"Which manufacturer has the highest market share in Scotland?"*
  - *"Show market share trends for electric vehicle manufacturers"*
  
  ### 🚗 **Vehicle Type Insights**
  Analyze vehicle characteristics and preferences:
  
  **Body Type Analysis:**
  - *"Which body type is most popular - SUV, Sedan, or Estate?"*
  - *"How do SUV registrations compare across different months?"*
  - *"Show coupe registrations by luxury vs mass market brands"*
  
  **Fuel Type Trends:**
  - *"How many electric vehicles were registered in 2024?"*
  - *"Compare petrol vs electric vehicle adoption by region"*
  - *"Which OEMs are leading in hybrid vehicle registrations?"*
  - *"Show the growth trend of electric vehicle registrations"*
  
  ### 📅 **Time-Based Analysis**
  Explore seasonal patterns and monthly trends:
  
  **Monthly Patterns:**
  - *"Which months had the highest vehicle registrations?"*
  - *"Show quarterly registration trends for BMW"*
  - *"Compare January vs December registration volumes"*
  
  **Seasonal Insights:**
  - *"How do luxury car registrations vary by season?"*
  - *"Show monthly electric vehicle registration trends"*
  - *"Which quarter has the strongest registration performance?"*
  
  ### 🌍 **Geographic Analysis**
  Dive deep into regional registration patterns:
  
  **Country-Level Insights:**
  - *"Which country has the highest vehicle registrations?"*
  - *"Compare England vs Scotland vehicle preferences"*
  - *"Show luxury vehicle registrations by country"*
  
  **District-Level Analysis:**
  - *"Which districts register the most electric vehicles?"*
  - *"Find the top regions for BMW registrations"*
  - *"Compare urban vs rural registration patterns"*
  - *"Show district-level market share for Tesla"*
  
  ---
  
  ## 🎯 Example Questions You Can Ask
  
  **📊 Registration Volume & Rankings:**
  - "What are the top 10 car manufacturers by registration volume?"
  - "Which OEMs registered more than 10,000 vehicles?"
  - "Show me the registration volume ranking by month"
  
  **🏆 Market Share Analysis:**
  - "Calculate BMW's market share in England for 2024"
  - "Which manufacturer has the highest market share in each country?"
  - "Show market share evolution for electric vehicle brands"
  
  **� Vehicle Preferences:**
  - "What's the most popular vehicle type combination?"
  - "How many SUV electric vehicles were registered?"
  - "Compare diesel vs petrol registrations by region"
  
  **📍 Geographic Patterns:**
  - "Which regions prefer luxury vehicles?"
  - "Where are electric vehicles being registered most?"
  - "Show registration hotspots for each manufacturer"
  
  **� Trends & Growth:**
  - "How did electric vehicle registrations grow month by month?"
  - "Which OEMs showed the strongest growth in Q4?"
  - "Compare year-over-year trends (if multiple years available)"
  
  **🔍 Detailed Analytics:**
  - "Show Tesla's district-level performance across the UK"
  - "Calculate monthly market share for premium brands"
  - "Find districts where luxury cars dominate"
  
  ---
  
  ## 💡 Important Query Guidelines
  
  **� Join-Based Analysis Required:**
  - All descriptive data requires joins with dimension tables
  - Fact table contains only foreign keys and registration counts
  - Use dimension tables for names, categories, and descriptions
  
  **🎨 Request Visualizations:**
  - "Show as a chart/graph/visualization"
  - "Create a dashboard showing..."
  - "Visualize the trend of..."
  - "Plot registration volumes over time"
  
  **📊 Specify Analysis Level:**
  - "At country level" vs "at district level"
  - "Monthly analysis" vs "quarterly trends"
  - "By manufacturer category" (Luxury, Mass Market, etc.)
  
  **⚡ Performance Tips:**
  - Specify time periods for faster queries: "in Q2 2024", "for January"
  - Be specific about brands: "BMW, Audi, Mercedes-Benz"
  - Choose geographic scope: "in England", "across all countries"
  
  **Data Coverage:** 2024 vehicle registrations | 319K records | 13 manufacturers | 28+ vehicle types | 7 countries | 2,777+ districts
