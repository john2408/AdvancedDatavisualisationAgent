  # 🚗 UK Vehicle Registration Analytics (Traditional Star Schema)
  
  ## 📊 What Can You Analyze?
  
  This database contains **UK vehicle registration data for 2023 and 2024** in a traditional star schema design. You can explore actual vehicle registration counts (not percentages) for different manufacturers across time, geography, and vehicle characteristics. All queries require joins between fact and dimension tables.
  
  **🎯 NEW: Year-over-Year Analysis Capability**
  With two complete years of data, you can now perform comprehensive comparisons between 2023 and 2024, analyze growth trends, and identify seasonal patterns across both years.
  
  ---
  
  ## 📈 Available Data & Analytics
  
  ### � **OEM Performance Analysis**
  Ask about vehicle manufacturers and their registration volumes:
  
  **Registration Volume Questions:**
  - *"Which car manufacturers registered the most vehicles in 2024?"*
  - *"How did BMW's registration volumes change month by month in 2024?"*
  - *"Compare Tesla vs traditional luxury brands registration counts"*
  - *"Show me the top 10 OEMs by total registrations across 2023-2024"*
  - **"What is the year-over-year trend for electric vehicles 2023 vs 2024?"**
  - **"Which OEMs showed the biggest growth from 2023 to 2024?"**
  
  **Market Share Calculations:**
  - *"Calculate market share for each OEM by country"*
  - *"Which manufacturer has the highest market share in Scotland?"*
  - *"Show market share trends for electric vehicle manufacturers"*
  - **"How did Tesla's market share change from 2023 to 2024?"**
  - **"Compare luxury brand market share performance between both years"**
  
