  - "Calculate monthly market share for premium brands"
  - "Find districts where luxury cars dominate"
  
  ---
  
  ## 💡 Important Query Guidelines
  
  **� Join-Based Analysis Required:**
  - All descriptive data requires joins with dimension tables
  - Fact table contains only foreign keys and registration counts
  - Use dimension tables for names, categories, and descriptions
  
  **🎨 Request Visualizations:**
  - "Show as a chart/graph/visualization"
  - "Create a dashboard showing..."
  - "Visualize the trend of..."
  - "Plot registration volumes over time"
  
  **📊 Specify Analysis Level:**
  - "At country level" vs "at district level"
  - "Monthly analysis" vs "quarterly trends"
  - "By manufacturer category" (Luxury, Mass Market, etc.)
  
  **⚡ Performance Tips:**
  - Specify time periods for faster queries: "in Q2 2024", "for January 2023"
  - Be specific about brands: "BMW, Audi, Mercedes-Benz"
  - Choose geographic scope: "in England", "across all countries"
  - **For year-over-year analysis: "compare 2023 vs 2024", "growth from 2023 to 2024"**
  - **Use specific quarters: "Q1 2023 vs Q1 2024", "2024Q1 and 2023Q1"**
  - **For time series plots: "plot over year_month", "show trends using datetime column"**
  - **Use year_month for continuous time visualization instead of separate year/month filters**
  
  **Data Coverage:** 2023-2024 vehicle registrations | 625K records | 13 manufacturers | 28+ vehicle types | 7 countries | 2,777+ districts | 24 months total
