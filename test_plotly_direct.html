<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Plotly Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-container { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
        #plot-container { width: 100%; height: 500px; border: 1px solid #ddd; }
    </style>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <h1>Direct Plotly Visualization Test</h1>
    
    <div class="test-container">
        <h2>Backend Plot Specification</h2>
        <p>Testing the exact plot spec returned by the backend API</p>
        <button onclick="testBackendSpec()">Test Backend Plot Spec</button>
        <button onclick="testSimpleSpec()">Test Simple Plot Spec</button>
        <div id="test-result"></div>
    </div>
    
    <div class="test-container">
        <h2>Plotly Visualization</h2>
        <div id="plot-container"></div>
    </div>

    <script>
        // Backend plot specification (from our test)
        const backendPlotSpec = {
            "type": "bar",
            "data": {
                "x": ["AUDI", "BMW", "MERCEDES-BENZ"],
                "y": [120, 150, 100]
            },
            "layout": {
                "title": "Vehicle Registrations by Car Manufacturer",
                "xaxis": {
                    "title": "oem_name",
                    "title_font": {"color": "#000000"},  
                    "tickfont": {"color": "#000000"}
                },
                "yaxis": {
                    "title": "total_vehicles",
                    "title_font": {"color": "#000000"},
                    "tickfont": {"color": "#000000"}
                },
                "barmode": "group",
                "showlegend": false,
                "plot_bgcolor": "white",
                "paper_bgcolor": "white",
                "font": {"color": "#2E2E2E", "family": "Arial, sans-serif"},
                "title_font": {"size": 16, "color": "#1f1f1f"}
            },
            "config": {"responsive": true}
        };

        // Simple test spec
        const simplePlotSpec = {
            "type": "bar",
            "data": {
                "x": ["BMW", "AUDI", "MERCEDES"],
                "y": [150, 120, 100]
            },
            "layout": {
                "title": "Simple Test Chart"
            },
            "config": {"responsive": true}
        };

        function testBackendSpec() {
            const resultDiv = document.getElementById('test-result');
            const plotContainer = document.getElementById('plot-container');
            
            try {
                resultDiv.innerHTML = '<div class="success">Testing backend plot specification...</div>';
                
                // Clear previous plot
                plotContainer.innerHTML = '';
                
                // Convert backend format to Plotly format
                const plotlyData = [{
                    x: backendPlotSpec.data.x,
                    y: backendPlotSpec.data.y,
                    type: backendPlotSpec.type,
                    marker: { color: '#3b82f6' }
                }];
                
                const plotlyLayout = {
                    title: backendPlotSpec.layout.title,
                    xaxis: { title: backendPlotSpec.layout.xaxis.title },
                    yaxis: { title: backendPlotSpec.layout.yaxis.title },
                    showlegend: false,
                    paper_bgcolor: 'white',
                    plot_bgcolor: 'white',
                    margin: { l: 60, r: 40, t: 80, b: 60 }
                };
                
                const plotlyConfig = {
                    responsive: true,
                    displayModeBar: true,
                    displaylogo: false
                };
                
                console.log('📊 Plotting with data:', plotlyData);
                console.log('📊 Layout:', plotlyLayout);
                
                Plotly.newPlot(plotContainer, plotlyData, plotlyLayout, plotlyConfig)
                    .then(() => {
                        resultDiv.innerHTML = '<div class="success">✅ SUCCESS! Backend plot spec rendered correctly</div>';
                        console.log('✅ Plotly render successful');
                    })
                    .catch((error) => {
                        resultDiv.innerHTML = '<div class="error">❌ ERROR: ' + error.message + '</div>';
                        console.error('❌ Plotly render error:', error);
                    });
                    
            } catch (error) {
                resultDiv.innerHTML = '<div class="error">❌ JavaScript Error: ' + error.message + '</div>';
                console.error('❌ JavaScript error:', error);
            }
        }

        function testSimpleSpec() {
            const resultDiv = document.getElementById('test-result');
            const plotContainer = document.getElementById('plot-container');
            
            try {
                resultDiv.innerHTML = '<div class="success">Testing simple plot specification...</div>';
                
                // Clear previous plot
                plotContainer.innerHTML = '';
                
                // Simple Plotly format
                const plotlyData = [{
                    x: simplePlotSpec.data.x,
                    y: simplePlotSpec.data.y,
                    type: 'bar',
                    marker: { color: '#3b82f6' }
                }];
                
                const plotlyLayout = {
                    title: simplePlotSpec.layout.title,
                    autosize: true
                };
                
                const plotlyConfig = {
                    responsive: true
                };
                
                console.log('📊 Simple plotting with data:', plotlyData);
                
                Plotly.newPlot(plotContainer, plotlyData, plotlyLayout, plotlyConfig)
                    .then(() => {
                        resultDiv.innerHTML = '<div class="success">✅ SUCCESS! Simple plot spec rendered correctly</div>';
                        console.log('✅ Simple Plotly render successful');
                    })
                    .catch((error) => {
                        resultDiv.innerHTML = '<div class="error">❌ ERROR: ' + error.message + '</div>';
                        console.error('❌ Simple Plotly render error:', error);
                    });
                    
            } catch (error) {
                resultDiv.innerHTML = '<div class="error">❌ JavaScript Error: ' + error.message + '</div>';
                console.error('❌ JavaScript error:', error);
            }
        }

        // Test backend spec by default
        window.onload = function() {
            testBackendSpec();
        };
    </script>
</body>
</html>
